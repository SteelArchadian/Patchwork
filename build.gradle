plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = "${minecraft_version}-${mod_version}"
group = mod_group_id
base { archivesName = 'patchwork' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    accessTransformers = files('src/main/resources/META-INF/accesstransformer.cfg')
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        server {
            server()
            programArgument '--nogui'
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

dependencies {
    compileOnly files('libs/biolith-neoforge-3.0.14.jar')
    compileOnly files('libs/terrain_slabs-neoforge-3.1.2.jar')
    compileOnly files('libs/voiceless-survival-2.0.1.jar')
    compileOnly files('libs/fzzy_config-0.7.7+1.21+neoforge.jar')
    compileOnly files('libs/watut-neoforge-1.21.0-1.2.7.jar')
    compileOnly files('libs/coroutil-neoforge-1.21.0-1.3.9.jar')
    compileOnly files('libs/supplementaries-1.21.1-3.9.9-neoforge.jar')
    compileOnly files('libs/moonlight-1.21.1-3.7.1-neoforge.jar')
    compileOnly files('libs/campfireresting-1.6.0-neoforge-1.21.1.jar')
    compileOnly files('libs/nomadictents-21.1.0.jar')
    compileOnly files('libs/iris-neoforge-1.8.14-beta.1+mc1.21.1.jar')
    compileOnly files('libs/Villager-API-1.21.1-neoforge-1.26.9.6.jar')
    compileOnly files('libs/skinlayers3d-neoforge-1.11.3-mc1.21.1.jar')
    compileOnly files('libs/seamless-loading-screen-2.2.1+1.21-neoforge.jar')
}

// Ship the license files inside the jar (LGPL-3.0-only; COPYING is the GPL text the LGPL builds on).
tasks.named('jar') {
    from(rootProject.file('LICENSE')) { rename { 'LICENSE-Patchwork.txt' } }
    from(rootProject.file('COPYING')) { rename { 'COPYING-Patchwork.txt' } }
    from(rootProject.file('NOTICE.md'))
}
